<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly KB review</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--line:#d9dce1;--ink:#1c1f24;--mute:#667085;--accent:#1f5eff}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1d2025;--line:#32363d;--ink:#e9ebee;--mute:#9aa1ab;--accent:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:0 0 12px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;margin-right:6px}
.mute{color:var(--mute);font-size:13px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px/1.4 ui-monospace,monospace;margin:6px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px;margin:4px 0 8px}
textarea{min-height:120px;resize:vertical}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5}
.err{color:#c0362c;font-size:13px}
.ex{border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
</style>
</head>
<body>
<h1>Weekly KB review</h1>
<div class="top">
  <button class="primary" id="gen">Generate report</button>
  <span class="mute" id="status"></span>
</div>
<div id="list"></div>
<script>
const $ = id => document.getElementById(id);
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = await r.text(); try { m = JSON.parse(m).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
const post = (p, b) => api(p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})});
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function card(p) {
  const c = el('div', 'card');
  const cands = p.candidates || [];
  const head = el('div');
  head.append(el('span', 'badge', 'AI suggests: ' + (p.action === 'replace' ? 'replace ' + p.chunk_id : 'add as new point')),
    el('span', 'mute', p.feedback_ids.length + ' past repl' + (p.feedback_ids.length === 1 ? 'y' : 'ies')));
  c.append(head, el('p', '', p.reason));
  c.append(el('div', 'mute', 'What agents replied:'));
  p.examples.forEach(x => { const d = el('div', 'ex'); d.append(el('div', 'mute', 'Q: ' + x.q), el('div', '', x.reply)); c.append(d); });

  c.append(el('div', 'mute', 'This is what the KB has (pick the chunk to replace):'));
  const sel = el('select');
  const none = el('option', '', '(none - new topic)'); none.value = ''; sel.append(none);
  cands.forEach(k => { const o = el('option', '', k.id + '. ' + k.title); o.value = k.id; sel.append(o); });
  sel.value = p.chunk_id || '';
  c.append(sel);
  const kb = el('pre'); c.append(kb);

  c.append(el('div', 'mute', 'Title (the question)'));
  const title = el('input'); c.append(title);
  c.append(el('div', 'mute', 'Audience'));
  const aud = el('input'); c.append(aud);
  c.append(el('div', 'mute', 'Answer text (you can edit)'));
  const body = el('textarea'); c.append(body);
  c.append(el('div', 'mute', 'Part for a new point (A overview, B broadcaster, C participant, D leaderboards)'));
  const part = el('input'); part.value = p.part || 'B'; part.maxLength = 1; c.append(part);
  c.append(el('div', 'mute', 'New keywords (comma separated)'));
  const kw = el('input'); kw.value = (p.keywords || []).join(', '); c.append(kw);

  const fill = () => {
    const k = cands.find(x => x.id === sel.value);
    if (k) { kb.textContent = '### ' + k.id + '. ' + k.title + '\nAudience: ' + k.audience + '\n' + k.body; }
    else { kb.textContent = 'No chunk selected.'; }
    if (k && k.id === p.chunk_id) { title.value = p.title; aud.value = p.audience; body.value = p.body; }
    else if (k) { title.value = k.title; aud.value = k.audience; body.value = k.body; part.value = k.id[0]; }
    else { title.value = p.action === 'add' ? p.title : ''; aud.value = p.action === 'add' ? p.audience : ''; body.value = p.action === 'add' ? p.body : ''; }
    rep.disabled = !k;
  };

  const msg = el('div', 'err');
  const rep = el('button', 'primary', 'Replace this Q&A');
  const add = el('button', '', 'Add as new point');
  const no = el('button', '', 'Reject');
  const btns = [rep, add, no];
  const run = async (fn) => {
    btns.forEach(b => b.disabled = true); msg.textContent = '';
    try { await fn(); c.remove(); left(); } catch (e) { msg.textContent = e.message; btns.forEach(b => b.disabled = false); fill(); }
  };
  const apply = mode => run(() => post('/api/review/' + p.id + '/apply',
    {mode, chunk_id: sel.value, part: part.value, title: title.value, audience: aud.value, body: body.value, keywords: kw.value}));
  rep.onclick = () => apply('replace');
  add.onclick = () => apply('add');
  no.onclick = () => run(() => post('/api/review/' + p.id + '/reject'));
  sel.onchange = fill;
  const row = el('div'); row.append(rep, ' ', add, ' ', no);
  c.append(row, msg);
  fill();
  return c;
}

function left() { const n = $('list').children.length; $('status').textContent = n ? n + ' topic(s) to review' : 'Nothing left to review.'; }
async function load() {
  const items = await api('/api/review/proposals');
  $('list').innerHTML = '';
  items.forEach(p => $('list').append(card(p)));
  left();
}
$('gen').onclick = async () => {
  $('gen').disabled = true; $('status').textContent = 'Generating… this can take a minute.';
  try { const r = await post('/api/review/generate'); await load(); if (!r.count) $('status').textContent = 'No new replies to review.'; }
  catch (e) { $('status').textContent = 'Failed: ' + e.message; }
  $('gen').disabled = false;
};
load().catch(e => { $('status').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
