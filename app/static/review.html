<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly review</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--line:#d9dce1;--ink:#1c1f24;--mute:#667085;--accent:#1f5eff}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1d2025;--line:#32363d;--ink:#e9ebee;--mute:#9aa1ab;--accent:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Noto Sans Devanagari",sans-serif;padding:16px;max-width:900px;margin-inline:auto}
h1{font-size:20px;margin:0 0 12px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px/1.4 system-ui,"Noto Sans Devanagari",sans-serif;margin:6px 0}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px;margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
textarea{min-height:120px;resize:vertical}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:#c0362c;font-size:13px;margin-top:6px}
.stored{border-left:3px solid var(--accent);padding-left:8px;margin:8px 0 10px}
.row2{display:flex;gap:10px}
.row2>div{flex:1}
.chk{display:inline-flex;align-items:center;margin:0 14px 6px 0;cursor:pointer}
.small{max-width:460px}
.small-btn{font-size:12px;padding:2px 8px;margin-left:6px;border-radius:4px;cursor:pointer}
.ready{border-left:3px solid #1a8f4c}
.ready .item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<h1>Weekly review</h1>
<div class="top">
  <button id="gen">Generate report</button>
  <button id="addcard">+ Add card</button>
  <button class="primary" id="upd" disabled>Update KB</button>
  <span class="mute" id="status"></span>
</div>
<div class="mute" style="margin-bottom:10px">Save card only keeps your edits. The KB changes (one re-index) only when you press Update KB.</div>
<div id="staged"></div>
<div id="list"></div>
<script>
const $ = id => document.getElementById(id);
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = await r.text(); try { m = JSON.parse(m).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
const post = (p, b) => api(p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b || {})});
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const parseAud = s => (s || '').split(',').map(a => a.trim()).filter(a => a && a.toLowerCase() !== 'everyone');
let FEATURES = [];

function card(p) {
  const x = p.extra || {}, st = x.stored || null, manual = !!x.manual, sg = x.stage || {};
  const c = el('div', 'card');
  if (manual) c.append(el('div', 'mute', 'Manual card: you write the question and the answer.'));
  else { const n = p.feedback_ids.length; c.append(el('div', 'mute', n + ' agent repl' + (n === 1 ? 'y' : 'ies') + ' on this topic')); }

  if (!manual) {
    const sd = el('div', 'stored');
    const line = el('div');
    line.append(el('b', '', 'What is currently stored: '), document.createTextNode(st ? st.title : 'Not stored'));
    sd.append(line);
    if (st) sd.append(el('pre', '', st.body));
    c.append(sd);
  }
  if ((x.also_features || []).length) {
    const w = el('div', 'err', 'Heads up: the agents answered from more than one feature (also: ' + x.also_features.join(', ') +
      '). The KB keeps one feature per entry. Keep only the part about the feature you choose below; add the other feature on its own card or by hand.');
    w.style.marginBottom = '8px'; c.append(w);
  }
  // feature + topic
  const row = el('div', 'row2');
  const fw = el('div'), tw = el('div');
  const fsel = el('select'), tsel = el('select');
  const fph = el('option', '', 'Choose feature...'); fph.value = ''; fsel.append(fph);
  FEATURES.forEach(f => { const o = el('option', '', f.name); o.value = f.id; fsel.append(o); });
  fsel.value = sg.feature_id || x.feature_id || '';  // for auto cards: only set when found from the KB chunks the drafts used
  const feat = () => FEATURES.find(f => f.id === fsel.value);
  const addFeatBtn = el('button', 'small-btn', '+ Add feature');
  addFeatBtn.type = 'button';
  addFeatBtn.onclick = async () => {
    const name = (prompt('Enter new feature name (e.g. PK, Live Stream):') || '').trim();
    if (!name) return;
    try {
      const nf = await post('/api/features', {name});
      FEATURES.push(nf);
      const opt = el('option', '', nf.name); opt.value = nf.id;
      fsel.append(opt); fsel.value = nf.id;
      onFeature();
    } catch (e) { alert('Could not add feature: ' + e.message); }
  };
  const fHeader = el('div', 'mute', 'Feature (required) '); fHeader.append(addFeatBtn);
  fw.append(fHeader, fsel);

  const addTopicBtn = el('button', 'small-btn', '+ Add topic/part');
  addTopicBtn.type = 'button';
  addTopicBtn.onclick = async () => {
    const f = feat();
    if (!f) { alert('Pick a feature first'); return; }
    const tname = (prompt('Enter new topic title for ' + f.name + ' (e.g. Refunds, Stream setup):') || '').trim();
    if (!tname) return;
    try {
      const nf = await post('/api/features/' + f.id + '/topics', {name: tname});  // writes "## PART X" into this feature's file
      f.topics = nf.topics;
      drawTopics();
      const hit = f.topics.find(t => t.name.toLowerCase() === tname.toLowerCase());
      if (hit) tsel.value = hit.part;
    } catch (e) { alert('Could not add topic: ' + e.message); }
  };
  const tHeader = el('div', 'mute', 'Topic / Section (required for a new point) '); tHeader.append(addTopicBtn);
  tw.append(tHeader, tsel);
  row.append(fw, tw);

  // manual cards: add a new point, or replace an existing one
  let act = null, pointSel = null, points = [];
  if (manual) {
    act = el('select');
    [['add', 'Add as a new point'], ['replace', 'Replace an existing point']].forEach(([v, t]) => { const o = el('option', '', t); o.value = v; act.append(o); });
    act.value = sg.mode || 'add';
    pointSel = el('select');
    c.append(el('div', 'mute', 'What do you want to do?'), act);
  }
  c.append(row);
  if (manual) { const pl = el('div', 'mute', 'Existing point of the chosen topic (pick one: its question and answer load below so you can edit and replace)'); pl.id = 'pl'; c.append(pl, pointSel); }

  const drawTopics = () => {
    tsel.innerHTML = '';
    const ph = el('option', '', 'Choose topic...'); ph.value = ''; tsel.append(ph);
    ((feat() || {}).topics || []).forEach(t => { const o = el('option', '', t.name); o.value = t.part; tsel.append(o); });
    const want = sg.part || ((st && fsel.value === x.feature_id) ? (p.part || '') : '');
    tsel.value = [...tsel.options].some(o => o.value === want) ? want : '';
  };

  c.append(el('div', 'mute', 'Question in English (KB heading & search)'));
  const question = el('input'); question.value = p.title || ''; c.append(question);
  const qNotice = el('div', 'mute', 'ℹ️ Note: Auto-translated & cleaned into English for KB heading when you press Update KB.');
  qNotice.style.fontSize = '12px'; qNotice.style.marginTop = '2px'; qNotice.style.marginBottom = '8px';
  c.append(qNotice);

  // audience: multi-select checkboxes (Everyone clears others; specific checkboxes can be combined)
  c.append(el('div', 'mute', 'Audience (Multi-select)'));
  const audBox = el('div'); c.append(audBox);
  let selected = parseAud(p.audience);
  const msg = el('div', 'err');
  const drawAud = () => {
    audBox.innerHTML = '';
    const mk = (label, checked, onchange) => {
      const l = el('label', 'chk'); const i = document.createElement('input');
      i.type = 'checkbox'; i.checked = checked; i.onchange = () => onchange(i.checked);
      l.append(i, label); return l;
    };
    audBox.append(mk('Everyone', !selected.length, v => { if (v) selected = []; drawAud(); }));
    [...new Set([...((feat() || {}).audiences || ['Broadcaster', 'Participant']), ...selected])].forEach(a =>
      audBox.append(mk(a, selected.includes(a), v => {
        selected = v ? [...selected.filter(s => s !== a), a] : selected.filter(s => s !== a);
        drawAud();
      })));
    const addA = el('button', 'small-btn', '+ Add audience');
    addA.type = 'button';
    addA.onclick = async () => {
      const f = feat();
      if (!f) { msg.textContent = 'Choose a feature first, then add an audience.'; fsel.focus(); return; }
      const name = (prompt('New audience name for ' + f.name) || '').trim();
      if (!name) return;
      try {
        const r = await post('/api/features/' + f.id + '/audience', {name});
        f.audiences = r.audiences;
        const hit = r.audiences.find(a => a.toLowerCase() === name.toLowerCase()) || name;
        if (!selected.includes(hit)) selected = [...selected, hit];
        msg.textContent = ''; drawAud();
      } catch (e) { msg.textContent = e.message; }
    };
    audBox.append(addA);
  };

  c.append(el('div', 'mute', 'Answer (edit if needed)'));
  const body = el('textarea'); body.value = p.body || ''; c.append(body);
  c.append(el('div', 'mute', 'Feature search words (optional, leave blank if none): short forms customers use for the WHOLE feature, comma separated. Saved in the feature\'s KB file when you press Update KB.'));
  const savedBox = el('div', 'mute'); c.append(savedBox);
  const kw = el('input', 'small'); kw.value = (p.keywords || []).join(', '); c.append(kw);
  const showSaved = () => { const sv = (feat() || {}).keywords || []; savedBox.textContent = sv.length ? 'Already saved for this feature: ' + sv.join(', ') : ''; };

  const drawPoints = () => {  // points of the chosen feature AND topic, e.g. "B1. Question..."
    pointSel.innerHTML = '';
    const ph = el('option', '', !fsel.value ? 'Choose a feature first...' : !tsel.value ? 'Choose a topic first...' : 'Choose a point...');
    ph.value = ''; pointSel.append(ph);
    points.filter(q => q.part === tsel.value).forEach(q => {
      const o = el('option', '', q.id + '. ' + q.title); o.value = q.id; pointSel.append(o);
    });
    if (sg.chunk && points.some(q => q.id === sg.chunk && q.part === tsel.value)) pointSel.value = sg.chunk;
  };
  const loadPoints = async () => {
    points = [];
    if (fsel.value) { try { points = await api('/api/features/' + fsel.value + '/points'); } catch (e) { msg.textContent = e.message; } }
    drawPoints();
  };
  const showMode = () => {
    const rep = manual && act.value === 'replace';
    pointSel.style.display = rep ? '' : 'none'; c.querySelector('#pl').style.display = rep ? '' : 'none';  // topic stays visible in both modes
  };
  const onFeature = () => { drawTopics(); drawAud(); showSaved(); if (manual) loadPoints(); sync(); };
  const sync = () => { if (rep) rep.disabled = !(st && fsel.value === x.feature_id); };

  const no = el('button', '', manual ? 'Discard card' : 'Reject');
  let rep = null, add = null, save = null;
  const btns = el('div');
  if (manual) {
    save = el('button', 'primary', 'Save card');
    btns.append(save, ' ', no);
  } else {
    rep = el('button', 'primary', 'Save card: replace this Q&A');
    add = el('button', '', 'Save card: add as new point');
    btns.append(rep, ' ', add, ' ', no);
  }
  const all = () => [rep, add, save, no].filter(Boolean);
  const run = async (fn) => {
    all().forEach(b => b.disabled = true); msg.textContent = '';
    try { await fn(); c.remove(); await loadStaged(); left(); }
    catch (e) { msg.textContent = e.message; all().forEach(b => b.disabled = false); sync(); }
  };
  const stage = (mode, chunk) => {
    msg.textContent = '';
    const missing = [];  // show EVERYTHING that is missing at once, not one field per click
    if (!fsel.value) missing.push('Feature');
    if (mode === 'add' && !tsel.value) missing.push('Topic / Section');
    if (mode === 'replace' && !chunk) missing.push('the point to replace');
    if (!question.value.trim()) missing.push('Question');
    if (!body.value.trim()) missing.push('Answer');
    if (missing.length) {
      msg.textContent = 'Please fill: ' + missing.join(', ') + '.';
      const first = !fsel.value ? fsel : (mode === 'add' && !tsel.value) ? tsel : !question.value.trim() ? question : body;
      first.focus(); return;
    }
    return run(() => post('/api/review/' + p.id + '/stage', {
      mode, feature: fsel.value, part: tsel.value, chunk, title: question.value, audience: selected.join(', '),
      body: body.value, keywords: kw.value}));
  };
  if (manual) {
    save.onclick = () => stage(act.value, pointSel.value);
    act.onchange = () => { showMode(); };
    pointSel.onchange = () => {
      const q = points.find(z => z.id === pointSel.value); if (!q) return;
      question.value = q.title; body.value = q.body; selected = parseAud(q.audience); drawAud(); tsel.value = q.part;
    };
  } else {
    rep.onclick = () => stage('replace', st ? st.id : '');
    add.onclick = () => {
      if (st && question.value.trim() === st.title.trim()) {  // a new point needs its own question
        const q = (x.llm_question || '').trim();
        if (!q || q === st.title.trim()) { msg.textContent = 'Type a new question for the new point.'; return; }
        question.value = q;
        msg.textContent = 'New question filled in. Check it, then press Save card again.';
        return;
      }
      stage('add', '');
    };
  }
  no.onclick = () => run(() => post('/api/review/' + p.id + '/reject'));
  fsel.onchange = () => { msg.textContent = ''; onFeature(); };
  tsel.onchange = () => { msg.textContent = ''; if (manual) drawPoints(); };
  c.append(btns, msg);
  onFeature();
  if (manual) showMode();
  return c;
}

function left() { const n = $('list').children.length; $('status').textContent = n ? n + ' card(s) to review' : 'Nothing left to review.'; }

let STAGED = [];
async function loadStaged() {
  STAGED = await api('/api/review/staged');
  const box = $('staged'); box.innerHTML = '';
  $('upd').disabled = !STAGED.length;
  $('upd').textContent = STAGED.length ? 'Update KB (' + STAGED.length + ')' : 'Update KB';
  if (!STAGED.length) return;
  const t = el('div', 'card ready');
  t.append(el('b', '', 'Ready for Update KB (' + STAGED.length + '). Nothing is in the KB yet.'));
  STAGED.forEach(p => {
    const sg = (p.extra || {}).stage || {};
    const f = FEATURES.find(z => z.id === sg.feature_id) || {name: sg.feature_id};
    const what = sg.mode === 'replace' ? 'Replace ' + sg.feature_id + ':' + sg.chunk : 'Add new to ' + f.name + ', topic ' + sg.part;
    const item = el('div', 'item');
    const left_ = el('div'); left_.append(el('b', '', what + ': '), document.createTextNode(p.title));
    const b = el('div');
    const edit = el('button', 'small-btn', 'Edit');
    edit.onclick = async () => { try { await post('/api/review/' + p.id + '/unstage'); await load(); } catch (e) { alert(e.message); } };
    const rm = el('button', 'small-btn', 'Remove');
    rm.onclick = async () => { if (!confirm('Remove this card? Its agent replies stop being used.')) return; try { await post('/api/review/' + p.id + '/reject'); await load(); } catch (e) { alert(e.message); } };
    b.append(edit, rm); item.append(left_, b); t.append(item);
  });
  box.append(t);
}
async function load() {
  FEATURES = await api('/api/features');
  const items = await api('/api/review/proposals');
  $('list').innerHTML = '';
  items.forEach(p => $('list').append(card(p)));
  await loadStaged();
  left();
}
$('gen').onclick = async () => {
  $('gen').disabled = true; $('status').textContent = 'Generating... this can take a minute.';
  try { const r = await post('/api/review/generate'); await load(); if (!r.count) $('status').textContent = 'No new replies to review.'; }
  catch (e) { $('status').textContent = 'Failed: ' + e.message; }
  $('gen').disabled = false;
};
$('addcard').onclick = async () => {
  try { const p = await post('/api/review/cards'); $('list').prepend(card(p)); left(); window.scrollTo(0, 0); }
  catch (e) { $('status').textContent = 'Failed: ' + e.message; }
};
$('upd').onclick = async () => {
  if (!confirm('Update the KB with ' + STAGED.length + ' saved card(s)? The KB is re-indexed once; if anything fails, nothing changes.')) return;
  $('upd').disabled = true; $('gen').disabled = true; $('status').textContent = 'Updating the KB... please wait (translating, backing up, re-indexing).';
  try { const r = await post('/api/review/update-kb'); await load(); $('status').textContent = 'KB updated: ' + r.targets.join(', '); }
  catch (e) { $('status').textContent = 'Failed (nothing was changed): ' + e.message; await loadStaged(); }
  $('gen').disabled = false;
};
load().catch(e => { $('status').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
